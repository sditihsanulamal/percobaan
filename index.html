<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Jurnal Mutaba'ah</title>
    
    <!-- Font Premium: Playfair Display (Judul) & Plus Jakarta Sans (Konten) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #997A15;
            --bg-dark: #05130d;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(212, 175, 55, 0.15);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        body { 
            background-color: var(--bg-dark); 
            color: white; 
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding: 60px 20px;
        }

        /* Ambient Background Orbs */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 15% 50%, rgba(3, 54, 36, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
        }

        .header-container {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1s ease-out;
        }

        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: clamp(32px, 5vw, 46px); 
            font-weight: 700;
            margin-bottom: 12px; 
            /* Premium Gold Gradient Text */
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        p.subtitle { 
            color: var(--gold-light); 
            font-size: 14px; 
            font-weight: 600; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            opacity: 0.8;
        }

        /* Garis Ornamen Pemisah */
        .divider {
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            margin: 20px auto 0;
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
        }

        /* Glassmorphism Cards */
        .grade-section { 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border); 
            border-radius: 24px; 
            padding: 30px; 
            margin-bottom: 30px; 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            /* Animasi akan diatur via JavaScript inline style */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards;
        }

        .grade-title { 
            color: var(--gold-primary); 
            font-size: 20px; 
            font-weight: 700; 
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .grade-title::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.3), transparent);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 16px; 
        }

        /* Premium Buttons */
        .btn-kelas { 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 16px 12px; 
            border-radius: 16px; 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 15px;
            font-weight: 600; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Hover Glow Effect */
        .btn-kelas::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
            transition: all 0.5s ease;
        }

        .btn-kelas:hover { 
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark)); 
            color: #000; 
            transform: translateY(-4px); 
            box-shadow: 0 12px 20px rgba(212, 175, 55, 0.25),
                        0 0 15px rgba(212, 175, 55, 0.4); 
            border-color: var(--gold-light);
        }

        .btn-kelas:hover::before {
            left: 150%;
        }
        
        .btn-kelas:active { 
            transform: translateY(-1px); 
            box-shadow: 0 5px 10px rgba(212, 175, 55, 0.3);
        }

        /* Keyframes Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    
    <!-- Latar belakang cahaya -->
    <div class="ambient-bg"></div>

    <div class="header-container">
        <h1>Pilih Kelas Ananda</h1>
        <p class="subtitle">Jurnal Mutaba'ah Hafalan</p>
        <div class="divider"></div>
    </div>
    
    <div class="container" id="kelasContainer">
        <!-- Tombol di-generate otomatis oleh JS -->
    </div>

    <script>
        // Kamus kelas
        const kamusKelas = {
            "1A": "1A Melayu", "1B": "1B Batak", "1C": "1C Nias", "1D": "1D Minang",
            "2A": "2A Jawa", "2B": "2B Sunda", "2C": "2C Mentawai", "2D": "2D Aceh",
            "3A": "3A Alas", "3B": "3B Pakpak", "3C": "3C Gorontalo", "3D": "3D Flores",
            "4A": "4A Dayak", "4B": "4B Betawi", "4C": "4C Badui", "4D": "4D Madura",
            "5A": "5A Tengger", "5B": "5B Toraja", "5C": "5C Ternate", "5D": "5D Bugis",
            "6A": "6A Kutai", "6B": "6B Paser", "6C": "6C Banjar", "6D": "6D Manggarai"
        };

        const container = document.getElementById('kelasContainer');
        const abjad = ['A', 'B', 'C', 'D'];
        
        let allHtml = '';

        for(let tingkat = 1; tingkat <= 6; tingkat++) {
            // Menambahkan delay animasi bertingkat (0.1s, 0.2s, dst) agar munculnya elegan
            let delayAnimasi = (tingkat * 0.1) + "s";
            
            let sectionHtml = `<div class="grade-section" style="animation-delay: ${delayAnimasi};">`;
            sectionHtml += `<div class="grade-title">Kelas ${tingkat}</div>`;
            sectionHtml += `<div class="grid">`;
            
            abjad.forEach(huruf => {
                let kode = tingkat + huruf;
                let namaLengkap = kamusKelas[kode];
                
                sectionHtml += `<a href="jurnal.html?kelas=${kode}" class="btn-kelas">${namaLengkap}</a>`;
            });
            
            sectionHtml += `</div></div>`;
            allHtml += sectionHtml;
        }

        // Render ke DOM satu kali saja (Lebih ringan & optimal)
        container.innerHTML = allHtml;
    </script>

</body>
</html>
